name: Deploy to AWS EC2

# Runs after CI passes on main. Needs repository secrets:
#   EC2_HOST      public IP or DNS of the instance
#   EC2_USER      usually "ubuntu" (Ubuntu AMI) or "ec2-user" (Amazon Linux)
#   EC2_SSH_KEY   contents of the .pem private key
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code and restart the container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/agentic-rag-doc-qa
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            sleep 20
            curl --fail http://localhost/health
